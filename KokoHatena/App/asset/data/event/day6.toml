# https://github.com/mori08/KokoHatena/blob/develop/KokoHatena/Src/ShareData/BoardManager/Board/MessageBoard/EventPlayer/README.md

## init ##
[[init]]
    event = "object"
    type = "message"
    name = "ui_text"

[[init]]
    event = "object"
    type = "texture"
    name = "back_room"
    [init.param]
        objectKey = "Room"
        pos = {x=0, y=0} 

[[init]]
    event = "object"
    type = "texture"
    name = "scr_black"
    [init.param]
        objectKey = "BlackScreen"
        pos = {x=0,y=0}

[[init]]
    event = "object"
    type = "texture"
    name = "obj_r"
    [init.param]
        objectKey = "Researcher"
        pos = {x=50, y=310}

[[init]]
    event = "jump"
    to = "e1"

[[init]]
    event = "receive"
    [[init.request]]
        text = "access"


## e1 ##
[[e1]]
    event = "wait"
    time = 2.0

[[e1]]
    event = "act"
    name = "scr_black"
    [e1.param]
        hide = true

[[e1]]
    event = "wait"
    time = 1.0

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "今日は君個人の意見を聞きたい"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "分かった"
        speaker = true

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "ココロは便利なものではない"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "ココロを持つということは、意思を持つということだ"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "自分で何をするかを決定する\n君の命令は聞かないかもしれない"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "命令を聞くようにもできるのではないか？"
        speaker = true

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "だとしても、感情がある\n命令を聞くことを嫌がることはあるだろう"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "仕事のできには差がうまれる"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "...そうだな\n心がある場合それは避けられない問題かもしれない"
        speaker = true

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "君はココロを持ったロボットが欲しいと思うか？"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "select"
        select = [
            {text = "欲しい", flag = "e2_1"},
            {text = "いらない", flag = "e2_2"}
        ]

[[e1]]
    event = "jump"
    to = "e2_1"
    flag = "e2_1"

[[e1]]
    event = "jump"
    to = "e2_2"
    flag = "e2_2"

