    name = "ui_text"
    [e3.param]
        type = "select"
        select = [
            {text = "人間は特別だからだ", flag = "e4_1"},
            {text = "分からない", flag = "e4_2"}
        ]

[[e3]]
    event = "jump"
    to = "e4_1"
    flag = "e4_1"

[[e3]]
    event = "jump"
    to = "e4_2"
    flag = "e4_2"


