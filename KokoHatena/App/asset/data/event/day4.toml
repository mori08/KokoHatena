# https://github.com/mori08/KokoHatena/blob/develop/KokoHatena/Src/ShareData/BoardManager/Board/MessageBoard/EventPlayer/README.md

## init ##
[[init]]
    event = "object"
    type = "message"
    name = "ui_text"

[[init]]
    event = "object"
    type = "texture"
    name = "back_room"
    [init.param]
        objectKey = "Room"
        pos = {x=0, y=0} 

[[init]]
    event = "object"
    type = "texture"
    name = "scr_black"
    [init.param]
        objectKey = "BlackScreen"
        pos = {x=0,y=0}

[[init]]
    event = "object"
    type = "texture"
    name = "obj_r"
    [init.param]
        objectKey = "Researcher"
        pos = {x=50, y=310}

[[init]]
    event = "jump"
    to = "e1"

[[init]]
    event = "receive"
    [[init.request]]
        text = "access"


