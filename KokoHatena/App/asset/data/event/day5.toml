## e2_1「役に立つ」##
[[e2_1]]
    event = "act"
    name = "ui_text"
    [e2_1.param]
        type = "message"
        text = "役に立つと思う"
        speaker = true
        wait = false

[[e2_1]]
    event = "act"
    name = "ui_text"
    [e2_1.param]
        type = "message"
        text = "...何か、心を持ったロボットにしかできないことがあるんじゃないか？"
        speaker = true

[[e2_1]]
    event = "act"
    name = "obj_r"
    [e2_1.param]
        anim = "think"

[[e2_1]]
    event = "act"
    name = "ui_text"
    [e2_1.param]
        type = "message"
        text = "ココロを持った私たちロボットの中には真剣に働かないものもいる\n人間の命令通りに動くとは限らない...それがココロだ"
        speaker = false

[[e2_1]]
    event = "act"
    name = "ui_text"
    [e2_1.param]
        type = "message"
        text = "...確かにそうか\nなら人間は何故心を持ったロボットを夢見るんだろうな"
        speaker = true

[[e2_1]]
    event = "act"
    name = "obj_r"
    [e2_1.param]
        anim = "awake"

[[e2_1]]
    event = "jump"
    to = "e3"


