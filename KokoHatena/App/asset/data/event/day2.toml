# https://github.com/mori08/KokoHatena/blob/develop/KokoHatena/Src/ShareData/BoardManager/Board/MessageBoard/EventPlayer/README.md

## init ##
[[init]]
    event = "object"
    type = "message"
    name = "ui_text"

[[init]]
    event = "object"
    type = "texture"
    name = "back_room"
    [init.param]
        objectKey = "Room"
        pos = {x=0, y=0}

[[init]]
    event = "object"
    type = "texture"
    name = "obj_r"
    [init.param]
        objectKey = "Researcher"
        pos = {x=50, y=310}

[[init]]
    event = "act"
    name = "obj_r"
    [init.param]
        anim = "waitRight"

[[init]]
    event = "object"
    type = "texture"
    name = "obj_chibi"
    [init.param]
        objectKey = "Chibi"
        pos = {x=-40, y=350}

[[init]]
    event = "object"
    type = "texture"
    name = "scr_black"
    [init.param]
        objectKey = "BlackScreen"
        pos = {x=0,y=0}

[[init]]
    event = "object"
    type = "texture"
    name = "obj_noppo"
    [init.param]
        objectKey = "Noppo"
        pos = {x=200, y=250}

[[init]]
    event = "jump"
    to = "e1"

[[init]]
    event = "receive"
    [[init.request]]
        text = "access"


## e1 ##
[[e1]]
    event = "wait"
    time = 2.0

[[e1]]
    event = "act"
    name = "scr_black"
    [e1.param]
        hide = true

[[e1]]
    event = "wait"
    time = 1.0

[[e1]]
    event = "act"
    name = "obj_chibi"
    [e1.param]
        mirror = true
        anim = "walk"
        move = {t=1.5, x=350, y=0}

[[e1]]
    event = "act"
    name = "obj_noppo"
    [e1.param]
        mirror = true
        anim = "walk"
        move = {t=2.5, x=100, y=0}

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "あれも同じロボットなのか..."
        speaker = false

[[e1]]
    event = "act"
    name = "obj_r"
    [e1.param]
        anim = "wait"

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "君か\n来てくれてありがとう"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "今日も話にきた"
        speaker = true

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "今日はハカセ...\n教授の話をしよう..."
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "教授はロボットにココロを持たせようとした\nココロを完成させるためにテストと改良を続けた"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "ロボットはそれを拒絶した\nココロを書き換えられたくなかった"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "message"
        text = "ココロのテストと改良は悪いことだと思うか？"
        speaker = false

[[e1]]
    event = "act"
    name = "ui_text"
    [e1.param]
        type = "select"
        select = [
            {text = "悪い", flag = "e2_1"},
            {text = "悪くない", flag = "e2_2"}
        ]

[[e1]]
    event = "jump"
    to = "e2_1"
    flag = "e2_1"

[[e1]]
    event = "jump"
    to = "e2_2"
    flag = "e2_2"

